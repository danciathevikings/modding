l_english:
the-victorian-era.1.t:0 "Victoria claims the British throne!"
the-victorian-era.1.d:0 "William IV dies at age 71. Victoria is now queen of the British Empire! In her diary she wrote, "I was awoke at 6 o'clock by Mamma, who told me the Archbishop of Canterbury and Lord Conyngham were here and wished to see me. I got out of bed and went into my sitting-room and alone, and saw them. Lord Conyngham then acquainted me that my poor Uncle, the King, was no more, and had expired at 12 minutes past 2 this morning, and consequently that I am Queen.""
the-victorian-era.1.a:0 "Amazing."
