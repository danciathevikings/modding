TUR_the_payitaht:0 "The Payitaht"
TUR_the_payitaht_desc:0 "a"
TUR_humiliation_from_egypt:0 "Humiliation From Egypt"
TUR_humiliation_from_egypt_desc:0 "a"
TUR_asakirimansureimuhammediyye:0 "Asâkir-i Mansûre-i Muhammediyye"
TUR_asakirimansureimuhammediyye_desc:0 "After the 2nd Mahmut Vaka-i Hayriye incident, he realized that the Ottoman Empire needed a more modern and disciplined army and established the Asâkir-i Mansûre-i Muhammediye army, which was the main army of the Ottoman Empire in a modern and disciplined European style."
TUR_the_resurgence_of_the_turkic_army:0 "The Resurgence of the Turkic Army"
TUR_the_resurgence_of_the_turkic_army_desc:0 "We must reform the new army of the Ottoman Empire with the values of our historical heritage, but with a modern, technological and new vision to strengthen our army and regain our former power."
TUR_continuing_european_style_military_reforms:0 "Continuing European style military reforms"
TUR_continuing_european_style_military_reforms_desc:0 "The Ottoman army must now be completely modernized, the only option is to adopt the European style army, with this innovative system our army will become even stronger and we will be able to compete with Europeans again, we will shoot Europe with its own weapon."
TUR_fabrikaihumayun:0 "Fabrika-i Hümayun"
TUR_fabrikaihumayun_desc:0 "Osmanlı devleti sanayi devrimini yapamayacak kadar geri kalmıştı, bunu düzeltmek için 2. Mahmut'un önderliğinde Osmanlı İmparatorluğu sanayileşmeyi ve sanayi devrimini yakalamak için Fabrika-i Hümayun adı verilen bir sanayi politikası geliştirdi."
TUR_legacy_of_the_great_turkish_war:0 "legacy of the great Turkish war"
TUR_legacy_of_the_great_turkish_war_desc:0 "a"
TUR_the_great_dardanelles_gun:0 "the great Dardanelles Gun"
TUR_the_great_dardanelles_gun_desc:0 "a"
TUR_new_training_centers:0 "New Training Centers"
TUR_new_training_centers_desc:0 "Ottoman soldiers were untrained, inexperienced and inexperienced, so a training center was opened thanks to the instructors brought from Europe, and now Ottoman soldiers would be trained and gain experience so that they could be made ready for war."
TUR_harbiye_ministry:0 "Harbiye Ministry"
TUR_harbiye_ministry_desc:0 "In 1836, the Ministry of War was established by Mahmud II for the newly established modern army."
TUR_asakir_gathering:0 "Asakir Gathering"
TUR_asakir_gathering_desc:0 "In line with orders sent by the Sultan to places far from the cities, young people began to be registered for military service."
TUR_state_detachments:0 "State Detachments"
TUR_state_detachments_desc:0 "Turkmens brought from all over the Ottoman Empire were mobilized to fill the army's shortage of soldiers and Turkmen-only divisions were formed"
